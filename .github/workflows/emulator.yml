name: emulator
# Tier 4 smoke tests (docs/HARDENING.md, Testing): the smoke/ test APK against Sortie on an Android 13 emulator with a second screen.
# Runs on demand (Actions > emulator > Run workflow, or gh workflow run emulator.yml --ref BRANCH), on pull requests labelled
# `emulator`, and on pull requests touching the display and task code these tests guard. Never publishes anything.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Keep in step with build.yml: the magazines the release build pins (the reader test opens one of their articles).
  ZINES_COMMIT: 65c179e913b30e643879d59325d676b99459a1a0
jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Run for dispatch, the emulator label, or display and task code
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'emulator') }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          watched='^app/src/main/java/.*/shell/|/(MainActivity|CompanionActivity|SecondaryHomeActivity|AnchorActivity)\.kt$'
          watched+='|^app/src/main/AndroidManifest\.xml$|^smoke/|^tools/emulator/|^\.github/workflows/emulator\.yml$'
          run=false
          if [[ $EVENT != pull_request ]]; then
            run=true
          elif [[ $ACTION == labeled ]]; then
            # another label on a watched PR must not rerun it; adding `emulator` always does
            if [[ $ADDED_LABEL == emulator ]]; then run=true; fi
          elif [[ $LABELLED == true ]]; then
            run=true
          else
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
            if grep -qE "$watched" <<< "$files"; then run=true; fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  smoke:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sortie-launcher/sortie-zines
          ref: ${{ env.ZINES_COMMIT }}
          path: release-content
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the debug app and its instrumented tests
        run: >-
          ./gradlew --no-daemon --console=plain assembleDebug :smoke:assembleDebug
          -PsortieMagazinesDir=release-content/issues
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the booted AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-google_apis-x86_64-v1
      - name: Create the AVD and a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Booted once for the snapshot cache."
      - name: Smoke tests on two screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/emulator/smoke.sh
      - name: Keep the device state, screenshot and logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-smoke
          path: smoke/build/emulator-smoke
          if-no-files-found: ignore
